<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>
<body>
    <!-- Navbar -->
<header class="w-full border-b bg-white">
    <div class="">
        <nav class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

        <!-- Logo -->
        <div>
            <img src="assets/IMG/meeshoLogo.svg" alt="Meesho Logo" class="w-32">
        </div>

        <!-- Search Bar -->
        <div class="w-[400px]">
            <input type="text" placeholder="Search products..." class="w-full border border-gray-300 rounded-md px-4 py-2 outline-none focus:border-pink-500">
        </div>

        <!-- Right Side -->
        <div class="flex items-center gap-6">

            <!-- Supplier -->
            <div>
                <a href="#" class="text-gray-700 hover:text-pink-600">
                    Become a supplier
                </a>
            </div>

            <!-- Investor -->
            <div>
                <a href="#" class="text-gray-700 hover:text-pink-600">
                    Investor Relations
                </a>
            </div>

            <!-- Profile -->
            <div class="flex flex-col items-center">
                <img src="assets/IMG/profile.png" alt="Profile" class="w-6 h-6">
                <span class="text-sm text-gray-700">Profile</span>
            </div>

            <!-- Cart -->
            <div class="flex flex-col items-center">
                <img src="assets/IMG/Cart.png" alt="Cart" class="w-6 h-6">
                <span class="text-sm text-gray-700">Cart</span>
            </div>

        </div>
       
        

    </nav>
    </div>
</header>
</body>
</html>
