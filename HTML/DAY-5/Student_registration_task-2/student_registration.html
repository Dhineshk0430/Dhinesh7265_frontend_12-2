<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student regstration form</title>
</head>
<body>
<section>
    <section>
        <h2>
            Student regstration form
        </h2>
    </section>
    <form>
        <label for="name">Student Name</label>
        <input id="name" placeholder="First letter in capital" type="text">
        <br><br>
        <label for="email">Email</label>
        <input id="email" type="email">
        <br><br>
        <label for="password">Password</label>
        <input id="password" type="password">
        <br><br>
        <label for="Age">Age</label>
        <input id="Age" type="age">
        <br><br>
        <label for="Date">Date of birth</label>
        <input id="Date" type="date">
        <br><br>
        <label for="gender">Gender</label>
        <input id="Gender" name="gender" type="radio"> Male
        <input id="Gender" name="gender" type="radio"> Female
        <br><br>
        <label for="Course">Course Dropdown</label>
        <select name="radio" id="Course">
        <option value="fs">Full stack</option>
        <option value="dm">Digital marketing</option>
        <option value="da">Data analyst</option>
        <option value="ds">Data scientist</option>
        </select>
        <br><br>
        <label for="Skills">Skills</label>
        <input type="text" name="Skills" placeholder="Maximum 5" id="Skills">
        <br><br>
        <label for="Address">Address</label>
        <textarea name="Address" id="Address"></textarea>
        <br><br>
        <button>Submit</button>
        <br>
        <button>Reset</button>
    </form>
</section>
</body>
</html>
