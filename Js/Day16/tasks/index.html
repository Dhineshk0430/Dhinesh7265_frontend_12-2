<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Management</title>
</head>
<body>

    <h1>Employee Registration Form</h1>

    <form id="employeeForm">
        <input type="text" id="empName" placeholder="Employee Name" required>
        <input type="number" id="empAge" placeholder="Employee Age" min="1" required>
        <input type="text" id="empDepartment" placeholder="Department" required>
        <input type="number" id="empSalary" placeholder="Salary" min="0.01" step="any" required>

        <button type="submit">Submit</button>
    </form>

    <h2>Employee Details</h2>

    <table border="1" cellpadding="10">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Age</th>
                <th>Department</th>
                <th>Salary</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody id="employeeTable"></tbody>
    </table>

    <script src="assets/data.js"></script>

</body>
</html>
